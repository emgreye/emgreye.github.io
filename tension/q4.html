<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tension</title>
    <link rel="icon" href="../images/10.png">
    <link rel="stylesheet" type="text/css" href="tension.css" />
    <script src="tension.js"></script>
</head>
<body>
    <main class="qgrid">
        <div class="back"><a href="../tension.html">⮪ Back</a></div>
        <p>What are the least common phonemes (sounds) in English, <em>based on frequency in spoken English</em>?</p>
        <button onclick="toggle('1', true)" id="a1">1 Point</button>
        <button onclick="toggle('1', false)" type="button" id="r1" style="display:none">/ʒ/, as in ca<b>s</b>ual</button>
        <button onclick="toggle('2', true)" type="button" id="a2">2 Points</button>
        <button onclick="toggle('2', false)" type="button" id="r2" style="display:none">/oj/, as in t<b>oi</b>let</button>
        <button onclick="toggle('3', true)" type="button" id="a3">3 Points</button>
        <button onclick="toggle('3', false)" type="button" id="r3" style="display:none">/eː/, as in c<b>are</b></button>
        <button onclick="toggle('4', true)" type="button" id="a4">4 Points</button>
        <button onclick="toggle('4', false)" type="button" id="r4" style="display:none">/θ/, as in <b>th</b>ink</button>
        <button onclick="toggle('5', true)" type="button" id="a5">5 Points</button>
        <button onclick="toggle('5', false)" type="button" id="r5" style="display:none">/tʃ/, as in <b>ch</b>ips</button>
        <button onclick="toggle('6', true)" type="button" id="a6">6 Points</button>
        <button onclick="toggle('6', false)" type="button" id="r6" style="display:none">/ɜː/, as in <b>ear</b>n</button>
        <button onclick="toggle('7', true)" type="button" id="a7">7 Points</button>
        <button onclick="toggle('7', false)" type="button" id="r7" style="display:none">/dʒ/, as in <b>j</b>ust</button>
        <button onclick="toggle('8', true)" type="button" id="a8">8 Points</button>
        <button onclick="toggle('8', false)" type="button" id="r8" style="display:none">/æw/, as in m<b>ou</b>th</button>
        <button onclick="toggle('9', true)" type="button" id="a9">9 Points</button>
        <button onclick="toggle('9', false)" type="button" id="r9" style="display:none">/aː/, as in c<b>ar</b>d</button>
        <button onclick="toggle('10', true)" type="button" id="a10">10 Points</button>
        <button onclick="toggle('10', false)" type="button" id="r10" style="display:none">/ʊ/, as in p<b>u</b>t</button>
        <button onclick="toggle('t1', true)" type="button" class="tension" id="at1">-5 Points</button>
        <button onclick="toggle('t1', false)" type="button" class="tension" id="rt1" style="display:none">/j/, as in <b>y</b>ear</button>
        <button onclick="toggle('t2', true)" type="button" class="tension" id="at2">-5 Points</button>
        <button onclick="toggle('t2', false)" type="button" class="tension" id="rt2" style="display:none">/ʃ/, as in <b>sh</b>ine</button>
        <button onclick="toggle('t3', true)" type="button" class="tension" id="at3">-5 Points</button>
        <button onclick="toggle('t3', false)" type="button" class="tension" id="rt3" style="display:none">/g/, as in e<b>gg</b>s</button>
        <button onclick="toggle('t4', true)" type="button" class="tension" id="at4">-5 Points</button>
        <button onclick="toggle('t4', false)" type="button" class="tension" id="rt4" style="display:none">/ʉw/, as in b<b>oo</b>t</button>
    </main>
</body>
</html>
