<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tension</title>
    <link rel="icon" href="../images/10.png">
    <link rel="stylesheet" type="text/css" href="tension.css" />
    <script src="tension.js"></script>
</head>
<body>
    <main class="qgrid">
        <div class="back"><a href="../tension.html">✖ Back</a></div>
        <p>What countries were Australian residents most commonly born in? <em>(The UK and China are split into their consistuent countries/territories in this data.)</em></p>
        <button onclick="toggle('1', true)" id="a1">1 Point</button>
        <button onclick="toggle('1', false)" type="button" id="r1" style="display:none">Australia: 68.0%</button>
        <button onclick="toggle('2', true)" type="button" id="a2">2 Points</button>
        <button onclick="toggle('2', false)" type="button" id="r2" style="display:none">India: 3.5%</button>
        <button onclick="toggle('3', true)" type="button" id="a3">3 Points</button>
        <button onclick="toggle('3', false)" type="button" id="r3" style="display:none">England: 3.5%</button>
        <button onclick="toggle('4', true)" type="button" id="a4">4 Points</button>
        <button onclick="toggle('4', false)" type="button" id="r4" style="display:none">Mainland China: 2.6%</button>
        <button onclick="toggle('5', true)" type="button" id="a5">5 Points</button>
        <button onclick="toggle('5', false)" type="button" id="r5" style="display:none">New Zealand: 2.3%</button>
        <button onclick="toggle('6', true)" type="button" id="a6">6 Points</button>
        <button onclick="toggle('6', false)" type="button" id="r6" style="display:none">Philippines: 1.5%</button>
        <button onclick="toggle('7', true)" type="button" id="a7">7 Points</button>
        <button onclick="toggle('7', false)" type="button" id="r7" style="display:none">Vietnam: 1.2%</button>
        <button onclick="toggle('8', true)" type="button" id="a8">8 Points</button>
        <button onclick="toggle('8', false)" type="button" id="r8" style="display:none">South Africa: 0.8%</button>
        <button onclick="toggle('9', true)" type="button" id="a9">9 Points</button>
        <button onclick="toggle('9', false)" type="button" id="r9" style="display:none">Nepal: 0.8%</button>
        <button onclick="toggle('10', true)" type="button" id="a10">10 Points</button>
        <button onclick="toggle('10', false)" type="button" id="r10" style="display:none">Sri Lanka: 0.7%</button>
        <button onclick="toggle('t1', true)" type="button" class="tension" id="at1">-5 Points</button>
        <button onclick="toggle('t1', false)" type="button" class="tension" id="rt1" style="display:none">Malaysia: 0.7%</button>
        <button onclick="toggle('t2', true)" type="button" class="tension" id="at2">-5 Points</button>
        <button onclick="toggle('t2', false)" type="button" class="tension" id="rt2" style="display:none">Italy: 0.6%</button>
        <button onclick="toggle('t3', true)" type="button" class="tension" id="at3">-5 Points</button>
        <button onclick="toggle('t3', false)" type="button" class="tension" id="rt3" style="display:none">Scotland: 0.5%</button>
        <button onclick="toggle('t4', true)" type="button" class="tension" id="at4">-5 Points</button>
        <button onclick="toggle('t4', false)" type="button" class="tension" id="rt4" style="display:none">United States: 0.4%</button>
    </main>
</body>
</html>
