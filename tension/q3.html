<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tension</title>
    <link rel="icon" href="../images/10.png">
    <link rel="stylesheet" type="text/css" href="tension.css" />
    <script src="tension.js"></script>
</head>
<body>
    <main class="qgrid">
        <div class="back"><a href="../tension.html">⮪ Back</a></div>
        <p>What actors made the most amount of money from a single movie? <em>This includes the initial salary, as well as percentages of profit made</em>.</p>
        <button onclick="toggle('1', true)" id="a1">1 Point</button>
        <button onclick="toggle('1', false)" type="button" id="r1" style="display:none">Alec Guiness (Star Wars): $524M</button>
        <button onclick="toggle('2', true)" type="button" id="a2">2 Points</button>
        <button onclick="toggle('2', false)" type="button" id="r2" style="display:none">Keanu Reeves (The Matrix 2 and 3): $283M</button>
        <button onclick="toggle('3', true)" type="button" id="a3">3 Points</button>
        <button onclick="toggle('3', false)" type="button" id="r3" style="display:none">Bruce Willis (The Sixth Sense): $200M</button>
        <button onclick="toggle('4', true)" type="button" id="a4">4 Points</button>
        <button onclick="toggle('4', false)" type="button" id="r4" style="display:none">Tom Cruise (Mission Impossible 2): $194M</button>
        <button onclick="toggle('5', true)" type="button" id="a5">5 Points</button>
        <button onclick="toggle('5', false)" type="button" id="r5" style="display:none">Jack Nicholson (Batman): 162M</button>
        <button onclick="toggle('6', true)" type="button" id="a6">6 Points</button>
        <button onclick="toggle('6', false)" type="button" id="r6" style="display:none">Tom Hanks (Forest Gump): 158M</button>
        <button onclick="toggle('7', true)" type="button" id="a7">7 Points</button>
        <button onclick="toggle('7', false)" type="button" id="r7" style="display:none">Will Smith (Men in Black 3): 145.4M</button>
        <button onclick="toggle('8', true)" type="button" id="a8">8 Points</button>
        <button onclick="toggle('8', false)" type="button" id="r8" style="display:none">Robert Downey Jr. (Iron Man 3): 108M</button>
        <button onclick="toggle('9', true)" type="button" id="a9">9 Points</button>
        <button onclick="toggle('9', false)" type="button" id="r9" style="display:none">Harrison Ford (Indiana Jones 4): 101M</button>
        <button onclick="toggle('10', true)" type="button" id="a10">10 Points</button>
        <button onclick="toggle('10', false)" type="button" id="r10" style="display:none">Sandra Bullock (Gravity): 100M</button>
        <button onclick="toggle('t1', true)" type="button" class="tension" id="at1">-5 Points</button>
        <button onclick="toggle('t1', false)" type="button" class="tension" id="rt1" style="display:none">Tom Holland (Spider-Man 4): 100M</button>
        <button onclick="toggle('t2', true)" type="button" class="tension" id="at2">-5 Points</button>
        <button onclick="toggle('t2', false)" type="button" class="tension" id="rt2" style="display:none">Johnny Depp (Pirates of the Caribbean 2): 99M</button>
        <button onclick="toggle('t3', true)" type="button" class="tension" id="at3">-5 Points</button>
        <button onclick="toggle('t3', false)" type="button" class="tension" id="rt3" style="display:none">Leonardo DiCaprio (Inception): 90M</button>
    </main>
</body>
</html>
