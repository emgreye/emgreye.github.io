<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tension</title>
    <link rel="icon" href="../images/10.png">
    <link rel="stylesheet" type="text/css" href="tension.css" />
    <script src="tension.js"></script>
</head>
<body>
    <main class="qgrid">
        <div class="back"><a href="../tension.html">✖ Back</a></div>
        <p>Which European countries have the highest population? <em>If a country is in multiple continents, only its European population is counted.</em></p>
        <button onclick="toggle('1', true)" id="a1">1 Point</button>
        <button onclick="toggle('1', false)" type="button" id="r1" style="display:none">European Russia: 110M</button>
        <button onclick="toggle('2', true)" type="button" id="a2">2 Points</button>
        <button onclick="toggle('2', false)" type="button" id="r2" style="display:none">Germany: 84M</button>
        <button onclick="toggle('3', true)" type="button" id="a3">3 Points</button>
        <button onclick="toggle('3', false)" type="button" id="r3" style="display:none">United Kingdom: 70M</button>
        <button onclick="toggle('4', true)" type="button" id="a4">4 Points</button>
        <button onclick="toggle('4', false)" type="button" id="r4" style="display:none">France: 67M</button>
        <button onclick="toggle('5', true)" type="button" id="a5">5 Points</button>
        <button onclick="toggle('5', false)" type="button" id="r5" style="display:none">Italy: 59M</button>
        <button onclick="toggle('6', true)" type="button" id="a6">6 Points</button>
        <button onclick="toggle('6', false)" type="button" id="r6" style="display:none">Spain: 48M</button>
        <button onclick="toggle('7', true)" type="button" id="a7">7 Points</button>
        <button onclick="toggle('7', false)" type="button" id="r7" style="display:none">Ukraine: 39M</button>
        <button onclick="toggle('8', true)" type="button" id="a8">8 Points</button>
        <button onclick="toggle('8', false)" type="button" id="r8" style="display:none">Poland: 37M</button>
        <button onclick="toggle('9', true)" type="button" id="a9">9 Points</button>
        <button onclick="toggle('9', false)" type="button" id="r9" style="display:none">Romania: 19M</button>
        <button onclick="toggle('10', true)" type="button" id="a10">10 Points</button>
        <button onclick="toggle('10', false)" type="button" id="r10" style="display:none">Netherlands: 18M</button>
        <button onclick="toggle('t1', true)" type="button" class="tension" id="at1">-5 Points</button>
        <button onclick="toggle('t1', false)" type="button" class="tension" id="rt1" style="display:none">European Turkey: 12M</button>
        <button onclick="toggle('t2', true)" type="button" class="tension" id="at2">-5 Points</button>
        <button onclick="toggle('t2', false)" type="button" class="tension" id="rt2" style="display:none">Belgium: 12M</button>
        <button onclick="toggle('t3', true)" type="button" class="tension" id="at3">-5 Points</button>
        <button onclick="toggle('t3', false)" type="button" class="tension" id="rt3" style="display:none">Sweden: 11M</button>
        <button onclick="toggle('t4', true)" type="button" class="tension" id="at4">-5 Points</button>
        <button onclick="toggle('t4', false)" type="button" class="tension" id="rt4" style="display:none">Czechia: 11M</button>
    </main>
</body>
</html>
