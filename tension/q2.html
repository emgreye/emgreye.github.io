<!DOCTYPE html>

<body>
    <main class="qgrid">
        <div class="back"><a href="../tension.html">⮪ Back</a></div>
        <p>Which people have the most views on their Wikipedia pages? <em>This doesn't include groups of people, like bands.</em></p>
        <button onclick="toggle('1', true)" id="a1">1 Point</button>
        <button onclick="toggle('1', false)" type="button" id="r1" style="display:none">Donald Trump</button>

        <button onclick="toggle('3', false)" type="button" id="r3" style="display:none">Christiano Ronaldo</button>
        <button onclick="toggle('4', true)" type="button" id="a4">4 Points</button>
        <button onclick="toggle('4', false)" type="button" id="r4" style="display:none">Barack Obama</button>
        <button onclick="toggle('5', true)" type="button" id="a5">5 Point</button>
        <button onclick="toggle('5', false)" type="button" id="r5" style="display:none">Elon Musk</button>

        <button onclick="toggle('10', true)" type="button" id="a10">10 Points</button>
        <button onclick="toggle('10', false)" type="button" id="r10" style="display:none">Taylor Swift</button>
        <button onclick="toggle('t1', true)" type="button" class="tension" id="at1">-5 points</button>
        <button onclick="toggle('t1', false)" type="button" class="tension" id="rt1" style="display:none">Dwayne "The Rock" Johnson</button>
        <button onclick="toggle('t2', true)" type="button" class="tension" id="at2">-5 points</button>
        <button onclick="toggle('t2', false)" type="button" class="tension" id="rt2" style="display:none">Lady Gaga</button>
