<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="icon" type="image/x-icon" href="feedback/lodge.ico">
    <link rel="stylesheet" href="feedback/style.css">
</head>
<body>
    <textarea id="textarea" placeholder="Feedback goes here." name="textarea" rows="10" cols="72"></textarea>
    <div id="buttons">
        <button type="button" id="format">🖊️ Format</button>
        <button type="button" id="copy">➕ Copy Qs</button>
        <button type="button" id="snq">🔰 SNQ</button>
        <select name="linetype" id="linetype">
            <option value="auto">❓Auto</option>
            <option value="question">❓Questions</option>
            <option value="thing">❓Things</option>
        </select>
        <button type="button" id="light">🔄 Mode</button>
        <button type="button" id="help"><a id="helplink" href="/fb-help.html" target="_blank">📙 Help</a></button>
        <button type="button" id="options">⚙️</button>
    </div>
    <div class="checker" style="display:none">
        <label for="date">Date:</label>
        <label class="container">&nbsp;
            <input type="checkbox" id="date">
            <span class="tick"></span>
        </label>
    </div>
    <div class="checker" style="display:none">
        <label class="ticker" for="kal">Document:</label>
        <label class="container">&nbsp;
            <input type="checkbox" id="kal">
            <span class="tick"></span>
        </label>
    </div>
    <div class="checker" style="display:none">
        <label class="ticker" for="upperq">Count Qs:</label>
        <label class="container">&nbsp;
            <input type="checkbox" id="upperq">
            <span class="tick"></span>
        </label>
    </div>
    <div class="checker" style="display:none">
        <label class="ticker" for="hl">Highlight:</label>
        <label class="container">&nbsp;
            <input type="checkbox" id="hl">
            <span class="tick"></span>
        </label>
    </div>
    <div class="checker" style="display:none">
        <label class="ticker" for="pa">PA:</label>
        <label class="container">&nbsp;
            <input type="checkbox" id="pa">
            <span class="tick"></span>
        </label>
    </div>
    <!-- <div class="checker" style="display:none">
        <label class="ticker" for="assessor">Final line is assessor:</label>
        <label class="container">&nbsp;
            <input type="checkbox" id="assessor">
            <span class="tick"></span>
        </label>
    </div> -->
    
    <h1 id="info"></h1>

    <div id="result">
    </div>

</body>
<script src="feedback/format.js"></script>
</html>
