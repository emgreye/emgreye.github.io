<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="icon" type="image/x-icon" href="feedback/lodge.ico">
    <link rel="stylesheet" href="feedback/style.css">
</head>
<body>
    <textarea id="textarea" placeholder="Values here." name="textarea" rows="10" cols="72"></textarea><br>
    <button type="button" id="format">Format</button>
    <button type="button" id="copy">Copy questions</button>
    <button type="button" id="light">Switch mode</button>
    
    <br><br>
    <label for="assessor">Final line is assessor:</label>
    <label class="container">&nbsp;
        <input type="checkbox" id="assessor">
        <span class="tick"></span>
    </label>
    <label class="ticker" for="date">Include date:</label>
    <label class="container">&nbsp;
        <input type="checkbox" id="date">
        <span class="tick"></span>
    </label>
    <label class="ticker" for="kal">Kalgoorlie mode:</label>
    <label class="container">&nbsp;
        <input type="checkbox" id="kal">
        <span class="tick"></span>
    </label>
    

    <h1 id="info"></h1>

    <div id="result">
    </div>

</body>
<script src="feedback/format.js"></script>
</html>
