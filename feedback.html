<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="icon" type="image/x-icon" href="feedback/lodge.ico">
    <link rel="stylesheet" href="feedback/style.css">
</head>
<body>
    <textarea id="textarea" placeholder="Feedback goes here." name="textarea" ></textarea>
    <div id="buttons">
        <button type="button" title="Format text" id="format">✍️ Format</button>
        <button type="button" title="Copy questions" id="copy">➕ Copy Qs</button>
        <button type="button" title="Format as Student Needs Questionnaire" id="snq">🔰 SNQ</button>
        <button type="button" title="Format as Record of Assessment" id="roa">🈸 ROA</button>
        <button type="button" title="Open text options" class="right" id="options">⚙️</button>
        <button type="button" title="Open display options" class="right" id="display">🎨</button>
        <button type="button" title="Open help page" class="right" id="help"><a id="helplink" href="/fb-help.html" target="_blank">❓</a></button>
    </div>
    <div id="disps">
        <label class="plaid" style="display:none" for="icons">Show text:</label>
        <label class="container plaid" style="display:none">&nbsp;
            <input type="checkbox" checked id="icons">
            <span class="tick"></span>
        </label>
        <button class="plaid" type="button" style="display:none" title="Change theme" id="light">🔄 Theme</button>
    </div>
    <div id="optis">
        <select class="checker" style="display:none" name="linetype" id="linetype">
            <option value="auto" selected>Auto</option>
            <option value="question">Questions</option>
            <option value="thing">Things</option>
        </select>
        <select class="checker" style="display:none" name="accent" id="accent">
            <option value="italic" selected>Italics</option>
            <option value="bold">Bold</option>
            <option value="hl">Highlight</option>
        </select>
        <label class="checker" style="display:none" for="date">Date:</label>
        <label class="container checker" style="display:none">&nbsp;
            <input type="checkbox" id="date">
            <span class="tick"></span>
        </label>
        <label class="checker" style="display:none" for="kal">Document:</label>
        <label class="container checker" style="display:none">&nbsp;
            <input type="checkbox" id="kal">
            <span class="tick"></span>
        </label>
        <label class="checker" style="display:none" for="upperq">Count Qs:</label>
        <label class="container checker" style="display:none">&nbsp;
            <input type="checkbox" id="upperq">
            <span class="tick"></span>
        </label>
        <label class="checker" style="display:none" for="pa">PA:</label>
        <label class="container checker" style="display:none">&nbsp;
            <input type="checkbox" id="pa">
            <span class="tick"></span>
        </label>
        <label class="checker" style="display:none" for="ai">AI:</label>
        <label class="container checker" style="display:none">&nbsp;
            <input type="checkbox" id="ai">
            <span class="tick"></span>
        </label>
        <label class="checker" style="display:none" for="assr">Assessor:</label>
        <label class="checker" style="display:none">
            <input type="text" name="Assessor" id="assr" placeholder="Jake McAuliffe">
        </label>
        <br/>
        <div class="checker" id="saveholder" style="display:none">
            <button type="button" title="Save options in new tab" id="saveopt">Export options</button>
        </div>
    </div>
    
    
    <h1 id="info"></h1>

    <div id="resulta">
    </div>

</body>
<script src="feedback/format.js"></script>
</html>
